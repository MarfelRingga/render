name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "ID composition Remotion (lihat src/Root.tsx)"
        default: "Main"
      mode:
        description: "preview = cepat & kecil, final = kualitas upload"
        type: choice
        options: [preview, final]
        default: preview

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2.2.0

      - run: bun install --frozen-lockfile

      # Opsional: buat voice over dari content/script.txt jika scripts/tts.mjs sudah ada.
      # - run: node scripts/tts.mjs
      #   env:
      #     GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Pastikan browser headless tersedia
        run: bunx remotion browser ensure

      - name: Render
        run: |
          mkdir -p out
          if [ "${{ inputs.mode }}" = "preview" ]; then
            bunx remotion render src/index.ts "${{ inputs.composition }}" out/video.mp4 --scale=0.5 --frames=0-149
          else
            bunx remotion render src/index.ts "${{ inputs.composition }}" out/video.mp4 --codec=h264
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.composition }}-${{ inputs.mode }}
          path: out/video.mp4
          retention-days: 7
