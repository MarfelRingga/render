name: Render Remotion Video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install headless browser dependencies
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render src/index.ts Main out/cara-kerja-nfc.mp4 --gl=swangle

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: cara-kerja-nfc
          path: out/cara-kerja-nfc.mp4
